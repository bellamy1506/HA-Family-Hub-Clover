<!--
  PROTOTYPE, throwaway. Map ticket "How does each person and kind of event look on the house board?"
  (HA-Family-Hub-Clover #57). The resting face's layout D with its sizes retuned to "structurally clear
  from across the room, readable up close", in five mark languages: A bars and names, B color blocks,
  C green for Us, D names with emoji, E blocks with green for Us. Round 1's C (a picture each) and
  D (emoji) are pictures in shots/. The bar switches the marks, the time of day, the distance, color vision,
  and wall or phone; the address's #hash holds the state (#a-morning-fit-normal-wall), and "shot"
  anywhere in it draws the face alone at full size for screenshots. Made-up data only.
  Icons: Material Design Icons 7.4.47 by Pictogrammers, Apache License 2.0
  (https://www.apache.org/licenses/LICENSE-2.0); the paths below are inlined unmodified.
-->
<style>
/* The page is a plain viewer; the face is the subject and keeps one fixed light look. */
:root { --page: #EEF0EC; --ink: #16191B; --soft: #4A5054; --line: #CDD2CC; --bar: #16191B; --bar-ink: #F4F5F2;
  --ui: Roboto, Inter, system-ui, -apple-system, "Segoe UI", sans-serif }
@media (prefers-color-scheme: dark) { :root { --page: #141719; --ink: #E8EAE6; --soft: #A9B0B4; --line: #2E3438; --bar: #E8EAE6; --bar-ink: #141719; color-scheme: dark } }
html, body { background: var(--page); color: var(--ink); font-family: var(--ui); margin: 0 }
body { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 230px max(16px, env(safe-area-inset-left, 0px)) }
h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700 }
.intro { margin: 0 0 14px; color: var(--soft); max-width: 72ch; line-height: 1.45 }
.stage { display: flex; justify-content: center; align-items: flex-start }
.frame { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 0 0 1px var(--line), 0 6px 24px rgba(0,0,0,.12) }
.frame > .face { position: absolute; top: 0; left: 0; transform-origin: 0 0 }
.frame.v-redgreen { filter: url(#deutan) } .frame.v-gray { filter: grayscale(1) }
.about { max-width: 72ch; margin: 14px auto 0; color: var(--soft); line-height: 1.45 }
.about b { color: var(--ink) }

/* The switcher: not part of the design being judged. */
.switcher { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: min(900px, calc(100vw - 20px)); box-sizing: border-box;
  background: var(--bar); color: var(--bar-ink); padding: 8px; border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.35) }
.switcher .grp { display: flex; align-items: center; gap: 2px; background: rgba(127,127,127,.2); border-radius: 12px; padding: 3px }
.switcher button { font: 600 14px var(--ui); color: inherit; background: transparent; border: 0; border-radius: 9px; padding: 7px 9px; cursor: pointer; min-height: 36px }
.switcher button[aria-pressed="true"] { background: var(--bar-ink); color: var(--bar) }
.switcher button:focus-visible { outline: 2px solid #E69F00; outline-offset: 1px }
.switcher .name { min-width: 160px; text-align: center; font: 700 14px var(--ui) }
body.shot { padding: 0; background: #F4F5F2 }
body.shot h1, body.shot .intro, body.shot .about, body.shot .switcher { display: none }
body.shot .frame { border-radius: 0; box-shadow: none }

/* ---------- The face: fixed light look (7:1 text, weights 500+, no thin type) ---------- */
.face { box-sizing: border-box; overflow: hidden; background: #F4F5F2; color: #16191B;
  font-family: Roboto, Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased }
.face * { box-sizing: border-box }
.face .clamp1, .face .clamp2, .face .clamp3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden }
.face .clamp1 { -webkit-line-clamp: 1 } .face .clamp2 { -webkit-line-clamp: 2 } .face .clamp3 { -webkit-line-clamp: 3 }
.face small.ap { font-size: .5em; font-weight: 600; margin-left: .08em; letter-spacing: .02em }
.face .wx { display: flex; align-items: center; gap: 12px; font-weight: 700 }
.face .wx svg { flex: none } .face .lo { color: #464C50; font-weight: 600 }
.face .needs { display: flex; align-items: center; background: #FFF0C7; border-left: 12px solid #E69F00; border-radius: 6px 14px 14px 6px; padding: 6px 24px; font-weight: 600 }

/* Rows. Everything is in em of the title, so the same marks carry to the phones at their own size. */
.face .ev { display: grid; grid-template-columns: .54em minmax(0, 1fr) auto; column-gap: .42em; align-items: start }
.face .ev .barc { align-self: stretch; border-radius: .2em; background: linear-gradient(var(--c) 50%, var(--c2) 50%); min-height: 1.9em }
.face .ev .tm { font-size: .76em; font-weight: 600; color: #464C50; white-space: nowrap; overflow-x: clip; overflow-y: visible; line-height: 1.35 }
.face .ev .tt { font-weight: 600; line-height: 1.15 }
.face .ev .ico { width: 1.2em; height: 1.2em; fill: #464C50; margin-top: .05em }
.face .ev.ad .barc { min-height: 0 }
.face .ev.ad .tt { font-size: .8em; padding: .12em 0 }
.face .ev.ad .ico { width: 1em; height: 1em }
.face .ev.work, .face .ev.ad { border-radius: .25em; padding-right: .3em;
  background: linear-gradient(135deg, color-mix(in srgb, var(--c) 13%, #F4F5F2) 50%, color-mix(in srgb, var(--c2) 13%, #F4F5F2) 50%) }
.face .who { margin-left: .45em; font-weight: 600; color: #464C50 }
.face .emo { font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; font-weight: 400 }
.face .tt .emo { font-size: .9em; line-height: 1 }
.D .band .line .emo { font-size: .8em }
.face .dot { display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: #16191B; margin-right: .32em; vertical-align: .1em }
.face .clash { width: 1.15em; height: 1.15em; fill: #464C50; margin-left: .35em; vertical-align: -.24em }
.face .tag { display: inline-block; font-size: .9em; font-weight: 700; background: #DDE1DB; color: #16191B; border-radius: .35em; padding: 0 .4em; margin-right: .4em }
.face .note { display: flex; align-items: flex-start; gap: .4em; font-weight: 600; line-height: 1.15 }
.face .note .ring { flex: none; width: .82em; height: .82em; border: .11em solid #464C50; border-radius: 50%; margin-top: .14em }
.face .note .dot { width: .38em; height: .38em; margin: .4em 0 0; flex: none }
.face .laterln, .face .more { font-size: .76em; font-weight: 600; color: #464C50 }

/* B and E: every event a tinted block; all-day and work lighter still. */
.blocks .list { gap: 7px }
.blocks .ev:not(.work):not(.ad) { border-radius: .25em; padding: .03em .3em .05em 0; grid-template-columns: .3em minmax(0, 1fr) auto;
  background: linear-gradient(135deg, color-mix(in srgb, var(--c) 17%, #F4F5F2) 50%, color-mix(in srgb, var(--c2) 17%, #F4F5F2) 50%) }
.blocks .ev:not(.work):not(.ad) .barc { margin: -.03em 0 -.05em; border-radius: .25em 0 0 .25em }
.blocks .ev.work, .blocks .ev.ad { grid-template-columns: .3em minmax(0, 1fr) auto;
  background: linear-gradient(135deg, color-mix(in srgb, var(--c) 8%, #F4F5F2) 50%, color-mix(in srgb, var(--c2) 8%, #F4F5F2) 50%) }

/* Layout D, sizes retuned: the shapes carry across the room, the words wait until you're close. */
.D { width: 1200px; height: 800px; display: flex; flex-direction: column; gap: 14px; padding: 24px 32px 22px }
.D .band { display: grid; grid-template-columns: 20px 1fr auto; column-gap: 22px; align-items: start }
.D .band .barc { border-radius: 10px; align-self: stretch; background: linear-gradient(var(--c) 50%, var(--c2) 50%) }
.D .band .lab { font-size: 28px; font-weight: 700; color: #464C50 }
.D .band .lab .tm { font-size: 1em; color: inherit }
.D .band .line { font-size: 84px; font-weight: 700; line-height: 1.04; letter-spacing: -.01em }
.D .band .line .t { margin-right: .26em }
.D .band .line .ico { width: .9em; height: .9em; fill: #464C50; vertical-align: -.14em; margin-right: .2em }
.D .band .side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px }
.D .clock { font-size: 60px; font-weight: 700; line-height: 1 }
.D .wx { font-size: 32px; gap: 8px }
.D .side .date { font-size: 24px; font-weight: 600; color: #464C50 }
.D .bring { font-size: 24px; font-weight: 600; display: flex; gap: 8px; align-items: center; white-space: nowrap }
.D .needs { min-height: 58px; font-size: 34px; line-height: 1.15 }
.D .cols { flex: 1; display: grid; grid-template-columns: 1.45fr 1fr 1fr 1fr; grid-template-rows: minmax(0, 1fr); min-height: 0 }
.D .col { display: flex; flex-direction: column; gap: 10px; padding: 0 16px; min-width: 0; min-height: 0; overflow: hidden; border-left: 2px solid #D5D9D3; font-size: 26px }
.D .col:first-child { border-left: 0; padding-left: 0; font-size: 28px }
.D .col .note { font-size: .93em }
.D .col .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.D .col .dn { font-size: 30px; font-weight: 700 }
.D .col .hl { font-size: 22px; font-weight: 600; color: #464C50; white-space: nowrap }
.D .list { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: hidden }
.D .dinner { margin-top: auto; border-top: 2px solid #D5D9D3; padding-top: 6px; font-size: 22px; font-weight: 600; line-height: 1.15 }
.D .dinner .lab { display: block; font-size: 18px; font-weight: 700; color: #464C50 }
.D .col:first-child .dinner { font-size: 26px }

.P { width: 390px; height: 844px; padding: 56px 16px 20px; display: flex; flex-direction: column; gap: 12px }
.P h2 { font-size: 22px; font-weight: 700; margin: 6px 0 0; display: flex; justify-content: space-between; align-items: baseline }
.P h2 span { font-size: 15px; font-weight: 600; color: #464C50 }
.P .list { display: flex; flex-direction: column; gap: 10px; font-size: 18px }
</style>

const NOTES = { today: [{ t: 'Buy cat litter', isNew: true }, { t: 'Call about the gutter quote' }], later: 3 };
const TIMES = {
  morning: { label: '7:40 am', now: hm(7, 40), needs: 'Furnace filter: check it today', bring: 'Rain from 2 pm' },
  afternoon: { label: '3:10 pm', now: hm(15, 10), needs: null, bring: 'Rain until 9 pm' },
  evening: { label: '8:50 pm', now: hm(20, 50), needs: 'Tomorrow 7:00: Date night (Us) overlaps Jenn\'s Dinner with friends', bring: null },
};
// Distances: the face's width as seen from that far, on a phone (about 153 CSS px per inch) held about 14 in away.
const DISTS = { fit: { label: 'Fit' }, '6ft': { label: '6 ft', w: Math.round(11.9 * 14 / 72 * 153) }, '9ft': { label: '9 ft', w: Math.round(11.9 * 14 / 108 * 153) } };
const VISIONS = { normal: { label: 'Color' }, redgreen: { label: 'Red-green' }, gray: { label: 'Gray' } };
const DEVICES = { wall: { label: 'Wall' }, phone: { label: 'Phone' } };

// ---------- the mark languages ----------
const VARIANTS = {
  a: { name: 'A · Bars and names', us: 'two', iconsNext: true,
    about: '<b>A. Bars and names.</b> Two person colors: Will blue, Jenn vermillion. Us and any plan you\'re both on get a two-tone bar, Will over Jenn. Each row says whose in words. A gray icon from a short word list (vet, dentist, haircut, oil change, trash, birthday, travel) sits at a row\'s right and on the Next line. Recommended by the icons research.' },
  b: { name: 'B · Color blocks', us: 'two', blocks: true, iconsNext: false,
    about: '<b>B. Color blocks.</b> Each event is a tinted block in its person\'s color, so whose shows as colored areas from across the room. Us and shared plans split the block Will and Jenn. Names in words; icons on rows only. Work and all-day items are paler, so routine hours fall back.' },
  c: { name: 'C · Green for Us', us: '#007A5A', iconsNext: true,
    about: '<b>C. Green for Us.</b> A, but Us and every plan you\'re both on get one color of their own, a darker green, instead of the two-tone bar; a plan on both your calendars still names you both. Names in words; gray icons on rows and the Next line. Both reviewers liked a green Us from across the room; its catch is that green and Jenn\'s vermillion look alike to red-green color-blind eyes (try Red-green).' },
  d: { name: 'D · Names with emoji', us: 'two', iconsNext: false, emoji: true,
    about: '<b>D. Names with emoji.</b> A, plus each person\'s emoji at the start of their titles (placeholders; each of you would pick yours); Us and shared plans show both. Gray event icons on rows only, so the Next line has one picture. Added after the first review, which rejected emoji or pictures in place of names but liked one beside them.' },
  e: { name: 'E · Blocks, green for Us', us: '#007A5A', blocks: true, iconsNext: false,
    about: '<b>E. Color blocks, green for Us.</b> B\'s tinted blocks with C\'s one green for Us and every shared plan, so each block is one color. Names in words; gray icons on rows only. Added after the second review, which kept C and asked for B\'s fill. Its catch is C\'s: green and Jenn\'s vermillion converge for red-green color-blind eyes (try Red-green).' },
};
const NAMES = { will: 'Will', jenn: 'Jenn', us: 'Us', both: 'Will, Jenn' };
const EMO = { will: '🌲', jenn: '🌷' };
// Fixed word table: whole words in the title, first match wins. Routine words (work, gym, yoga) and meals are left out.
const WORDS = [
  [/\b(vet|veterinarian)\b/i, 'paw'], [/\b(dentist|dental)\b/i, 'tooth'], [/\b(flight|airport)\b/i, 'airplane'],
  [/\b(trip|vacation|travel)\b/i, 'bag-suitcase'], [/\b(trash|garbage)\b/i, 'trash-can'],
  [/\b(birthday|bday)\b/i, 'cake-variant'], [/\bhaircut\b/i, 'content-cut'], [/\b(oil change|car service|tires)\b/i, 'car-wrench'],
];

// Whose colors a person is drawn in, in variant V: one color, or two for a two-tone mark.
function colors(p, V) {
  if (p === 'will') return [WILL, WILL];
  if (p === 'jenn') return [JENN, JENN];
  return V.us === 'two' ? [WILL, JENN] : [V.us, V.us];
}
const cvars = (p, V) => { const [a, b] = colors(p, V); return `--c:${a};--c2:${b}`; };
// D: each person's emoji leads the title; shared plans show both.
const emoji = (p, V) => V.emoji ? `<span class="emo">${(p === 'will' || p === 'jenn' ? [p] : ['will', 'jenn']).map(q => EMO[q]).join('')}</span> ` : '';
function icon(t, V, onNext) {
  const hit = !(onNext && !V.iconsNext) && WORDS.find(([re]) => re.test(t));
  return hit ? svg(hit[1], 'ico') : '';
}

// ---------- helpers ----------
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const tm = m => { const h = Math.floor(m / 60), mm = m % 60; return `${h % 12 || 12}:${String(mm).padStart(2, '0')}<small class="ap">${h < 12 ? 'am' : 'pm'}</small>`; };
const tmShort = m => { const h = Math.floor(m / 60), mm = m % 60; return `${h % 12 || 12}:${String(mm).padStart(2, '0')}`; };
const WX = {
  sun: '<circle cx="24" cy="24" r="9" fill="#E69F00"/><g stroke="#E69F00" stroke-width="3.5" stroke-linecap="round"><path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.9 9.9l4.2 4.2M33.9 33.9l4.2 4.2M9.9 38.1l4.2-4.2M33.9 14.1l4.2-4.2"/></g>',
  cloud: '<circle cx="16" cy="12" r="7" fill="#E69F00"/><path d="M14 38h22a8 8 0 0 0 0-16 11 11 0 0 0-21-2 8.5 8.5 0 0 0-1 18z" fill="#8A949A"/>',
  rain: '<path d="M13 30h23a8 8 0 0 0 0-16 11 11 0 0 0-21-2 8.5 8.5 0 0 0-2 18z" fill="#6E7A82"/><g stroke="#0072B2" stroke-width="3.5" stroke-linecap="round"><path d="M16 35l-3 7M26 35l-3 7M36 35l-3 7"/></g>',
};
const wxIcon = (k, px) => `<svg width="${px}" height="${px}" viewBox="0 0 48 48" aria-hidden="true">${WX[k]}</svg>`;

function row(e, V, now, keep) {
  const when = now ? `<span class="tag">Now</span>until ${tmShort(e.e)}` : e.work ? `${tmShort(e.s)} to ${tmShort(e.e)}` : tm(e.s);
  return `<div class="ev${e.work ? ' work' : ''}"${keep ? ' data-keep' : ''} style="${cvars(e.p, V)}"><span class="barc"></span>
    <div><div class="tm">${e.isNew ? '<span class="dot"></span>' : ''}${when}<span class="who">${NAMES[e.p]}</span>${e.clash ? svg('set-center', 'clash') : ''}</div>
    <div class="tt clamp2">${emoji(e.p, V)}${esc(e.t)}</div></div>${icon(e.t, V)}</div>`;
}
const allDay = (a, V) => `<div class="ev ad" data-keep style="${cvars(a.p, V)}"><span class="barc"></span><div class="tt clamp2">${esc(a.t)}</div>${icon(a.t, V)}</div>`;
const note = n => `<div class="note">${'<span class="ring"></span>'}<span class="clamp2">${esc(n.t)}</span>${n.isNew ? '<span class="dot"></span>' : ''}</div>`;
const laterLine = () => NOTES.later ? `<div class="laterln">Later (${NOTES.later}) ›</div>` : '';
const meals = d => [...(d.meals.breakfast ? [['Breakfast', d.meals.breakfast]] : []), ...(d.meals.lunch ? [['Lunch', d.meals.lunch]] : []), ['Dinner', d.meals.dinner || 'Not planned']];

// What the face knows at a moment. After today's last event has ended (and it's past 6 pm), it turns to tomorrow.
function moment(timeKey) {
  const T = TIMES[timeKey], now = T.now, today = DAYS[0];
  const nowEv = today.events.filter(e => e.s <= now && now < e.e), ahead = today.events.filter(e => e.s > now);
  const tomorrowFocus = !ahead.length && !nowEv.length && now >= hm(18);
  const fday = DAYS[tomorrowFocus ? 1 : 0], fahead = tomorrowFocus ? fday.events.slice() : ahead;
  return { T, now, today, nowEv: tomorrowFocus ? [] : nowEv, ahead, focus: tomorrowFocus ? 1 : 0, fday, next: fahead[0], later: fahead.slice(1), tomorrowFocus };
}

// ---------- the wall: layout D ----------
function renderWall(M, V) {
  const n = M.next;
  const lab = n ? `${M.tomorrowFocus ? `Tomorrow, ${M.fday.name}` : 'Next'} · ${NAMES[n.p]}` : '';
  const band = `<div class="band" style="${n ? cvars(n.p, V) : '--c:transparent;--c2:transparent'}"><span class="barc"></span>
    <div>${n ? `<div class="lab">${lab}</div><div class="line" data-shrink="64">${`<span class="clamp3"><span class="t">${tm(n.s)}</span>${icon(n.t, V, true)}${emoji(n.p, V)}${esc(n.t)}</span>`}</div>` : '<div class="line">Nothing else today</div>'}</div>
    <div class="side"><div class="clock">${tm(M.now)}</div><div class="date">${M.today.short}, ${M.today.mdate}</div><div class="wx">${wxIcon(M.today.wx.k, 36)}<span>${M.today.wx.hi}°</span><span class="lo">${M.today.wx.lo}°</span></div>${M.T.bring ? `<div class="bring">${wxIcon('rain', 28)}${esc(M.T.bring)}</div>` : ''}</div></div>`;
  const cols = DAYS.slice(M.focus, M.focus + 4).map((d, i) => {
    const first = i === 0;
    const notes = [...(first ? NOTES.today : []), ...(d.notes || [])].map(note).join('') + (first ? laterLine() : '');
    // The rows the needs line names (a clash on the day in focus) are never dropped, like the Next line.
    const rows = first ? [...M.nowEv.map(e => row(e, V, true)), ...M.later.map(e => row(e, V, false, M.T.needs && e.clash))] : d.events.map(e => row(e, V));
    const ms = meals(d).map(([k, v]) => `<div class="dinner"><span class="lab">${k}</span><span class="clamp2">${esc(v)}</span></div>`).join('');
    return `<div class="col"><div class="hd"><span class="dn">${first ? (M.tomorrowFocus ? 'Tomorrow' : 'Today') : `${d.short} ${d.num}`}</span><span class="hl">${d.wx.hi}° ${d.wx.lo}°</span></div>
      ${notes}<div class="list" data-fit>${d.allDay.map(a => allDay(a, V)).join('')}${rows.join('')}</div>${ms}</div>`;
  }).join('');
  return `<div class="face D${V.blocks ? ' blocks' : ''}">${band}${M.T.needs ? `<div class="needs"><span class="clamp2">${esc(M.T.needs)}</span></div>` : ''}<div class="cols">${cols}</div></div>`;
}

// ---------- the phone: the same rows at phone size ----------
function renderPhone(M, V) {
  const today = M.tomorrowFocus ? [] : [...M.nowEv.map(e => row(e, V, true)), ...M.ahead.map(e => row(e, V))];
  const day = (d, title) => `<h2>${title}<span>${d.short}, ${d.mdate}</span></h2><div class="list">${d.allDay.map(a => allDay(a, V)).join('')}${(d.notes || []).map(note).join('')}${d.events.map(e => row(e, V)).join('')}</div>`;
  return `<div class="face P${V.blocks ? ' blocks' : ''}">
    <h2>Today<span>${M.today.short}, ${M.today.mdate} · ${tmShort(M.now)}</span></h2>
    <div class="list">${NOTES.today.map(note).join('')}${laterLine()}${today.join('') || '<div class="more">Nothing left today</div>'}</div>
    ${day(DAYS[1], 'Tomorrow')}${day(DAYS[2], 'Sunday')}</div>`;
}

// Lists never cut a row in half: rows that don't fit drop from the end and are counted. The Next line shrinks
// a little to stay on one line when short, keeps two lines at full size when long, and only then shrinks to its floor.
function fit(root) {
  for (const el of root.querySelectorAll('[data-shrink]')) {
    const inner = el.firstElementChild, start = parseFloat(getComputedStyle(el).fontSize);
    let size = start; const lines = () => inner.clientHeight / (size * 1.04), set = v => { size = v; el.style.fontSize = `${v}px`; };
    while (lines() > 1.5 && size > 76) set(size - 4);
    if (lines() > 1.5) { set(start); while (lines() > 2.5 && size > +el.dataset.shrink) set(size - 4); }
  }
  for (const box of root.querySelectorAll('[data-fit]')) {
    const rows = [...box.children].filter(el => el.classList.contains('ev') && !el.hasAttribute('data-keep'));
    let hidden = 0; const more = document.createElement('div'); more.className = 'more';
    while (box.scrollHeight > box.clientHeight + 1 && rows.length) {
      rows.pop().remove(); hidden++;
      if (!more.isConnected) box.appendChild(more);
      more.textContent = `+${hidden} more`;
    }
  }
}

// ---------- viewer ----------
const state = { v: 'a', t: 'morning', d: 'fit', cv: 'normal', dev: 'wall', shot: false };
function readHash() {
  const parts = (location.hash || '').replace('#', '').split('-');
  Object.assign(state, { v: 'a', t: 'morning', d: 'fit', cv: 'normal', dev: 'wall' });
  for (const p of parts) {
    if (VARIANTS[p]) state.v = p; else if (TIMES[p]) state.t = p; else if (DISTS[p]) state.d = p;
    else if (VISIONS[p]) state.cv = p; else if (DEVICES[p]) state.dev = p;
  }
  state.shot = parts.includes('shot');
}
function writeHash() { const h = `#${state.v}-${state.t}-${state.d}-${state.cv}-${state.dev}`; if (location.hash !== h) history.replaceState(null, '', h); }
function layout() {
  const frame = document.getElementById('frame'), face = frame.firstElementChild;
  const W = state.dev === 'phone' ? 390 : 1200, H = state.dev === 'phone' ? 844 : 800;
  let w = W;
  if (!state.shot && state.dev === 'wall') w = state.d === 'fit' ? Math.min(W, document.documentElement.clientWidth - 32) : DISTS[state.d].w;
  const s = w / W;
  frame.style.width = `${Math.round(W * s)}px`; frame.style.height = `${Math.round(H * s)}px`;
  face.style.transform = `scale(${s})`;
}
function render() {
  const M = moment(state.t), V = VARIANTS[state.v], frame = document.getElementById('frame');
  frame.innerHTML = (state.dev === 'phone' ? renderPhone : renderWall)(M, V);
  frame.className = `frame v-${state.cv}`;
  document.getElementById('vname').textContent = V.name;
  document.getElementById('about').innerHTML = V.about + (state.dev === 'phone' ? ' <b>Phone:</b> the same rows at phone size, to show the marks carry over; how the phones are laid out is its own ticket.' : '');
  for (const [id, key] of [['times', 't'], ['dists', 'd'], ['visions', 'cv'], ['devices', 'dev']])
    for (const b of document.querySelectorAll(`#${id} button`)) b.setAttribute('aria-pressed', b.dataset.k === state[key]);
  document.body.classList.toggle('shot', state.shot);
  if (!state.shot) writeHash();
  layout(); fit(frame);
}
function buttons(id, obj, key) {
  const box = document.getElementById(id);
  box.innerHTML = Object.entries(obj).map(([k, o]) => `<button data-k="${k}" aria-pressed="false">${o.label}</button>`).join('');
  box.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state[key] = b.dataset.k; render(); } });
}
const keys = Object.keys(VARIANTS);
const step = n => { state.v = keys[(keys.indexOf(state.v) + n + keys.length) % keys.length]; render(); };
buttons('times', TIMES, 't'); buttons('dists', DISTS, 'd'); buttons('visions', VISIONS, 'cv'); buttons('devices', DEVICES, 'dev');
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
window.addEventListener('resize', layout);
window.addEventListener('hashchange', () => { readHash(); render(); });
readHash(); render();
if (document.fonts) document.fonts.ready.then(render);
</script>
</html>
