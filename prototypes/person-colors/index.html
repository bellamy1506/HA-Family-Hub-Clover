<!--
  PROTOTYPE, throwaway. Map ticket "Which 12 colors does each person choose from, and which does each start with?"
  (HA-Family-Hub-Clover #92). Three candidate sets of 12 person colors, each drawn the way it will be seen:
  the wall's resting face with the starting three, the same face with all 12, rows on a phone in light and in dark
  (both dark rules side by side), and Settings' People and colors with the 12, More colors and the close-color note.
  Tapping a color in Settings changes it everywhere on the page. The bar switches the set (A to C), the view and
  the distance; the address's #hash holds the state, and "shot" in it drops the page's own text for screenshots.
  Owner's pick (2026-11-01): A, with Will starting on Cornflower; the page opens on it. Made-up data only. Color math (WCAG contrast, OKLCH, CIELAB, CIEDE2000, Szafir 2018 at 0.3 degrees) is the
  research's (docs/research/person-colors.md on branch research/person-colors), re-done here in plain JavaScript.
  Icons: Material Design Icons 7.4.47 by Pictogrammers, Apache License 2.0; the paths below are inlined unmodified.
-->
<style>
:root { --page: #EEF0EC; --ink: #16191B; --soft: #4A5054; --line: #CDD2CC; --bar: #16191B; --bar-ink: #F4F5F2;

.stage { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: flex-start }

.cap { font: 700 15px var(--ui); margin: 0 0 6px; color: var(--ink) } .cap span { font-weight: 500; color: var(--soft) }

.frame > .face, .frame > .P, .frame > .S { position: absolute; top: 0; left: 0; transform-origin: 0 0 }

.about b { color: var(--ink) }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 10px; margin: 10px 0 }

/* The switcher: not part of the design being judged. */
.switcher { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: min(860px, calc(100vw - 20px)); box-sizing: border-box;
  background: var(--bar); color: var(--bar-ink); padding: 8px; border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.35) }

/* ---------- The wall's face: layout D with E's marks (7:1 text, weights 500+) ---------- */
.face { box-sizing: border-box; overflow: hidden; background: #F4F5F2; color: #16191B;

.face { --soft-b: #3A3E41 }

.D { width: 1200px; height: 800px; display: flex; flex-direction: column; gap: 14px; padding: 24px 32px 22px }

.D .band .line .t { margin-right: .26em }
.D .band .side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px }
.D .clock { font-size: 60px; font-weight: 700; line-height: 1 }
.D .wx { font-size: 32px }
.D .side .date { font-size: 24px; font-weight: 600; color: #464C50 }
.D .bring { font-size: 24px; font-weight: 600; display: flex; gap: 8px; align-items: center; white-space: nowrap }
.D .needs { min-height: 58px; font-size: 34px; line-height: 1.15 }
.D .cols { flex: 1; display: grid; grid-template-columns: 1.45fr 1fr 1fr 1fr; grid-template-rows: minmax(0, 1fr); min-height: 0 }
.D .col { display: flex; flex-direction: column; gap: 10px; padding: 0 16px; min-width: 0; min-height: 0; overflow: hidden; border-left: 2px solid #D5D9D3; font-size: 26px }
.D .col:first-child { border-left: 0; padding-left: 0; font-size: 28px }
.D .col .note { font-size: .93em }
.D .col .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.D .col .dn { font-size: 30px; font-weight: 700 }
.D .col .hl { font-size: 22px; font-weight: 600; color: #464C50; white-space: nowrap }
.D .list { flex: 1 1 auto; display: flex; flex-direction: column; gap: 7px; min-height: 0; overflow: hidden }
.D .dinner { margin-top: auto; border-top: 2px solid #D5D9D3; padding-top: 6px; font-size: 22px; font-weight: 600; line-height: 1.15 }
.D .dinner .lab { display: block; font-size: 18px; font-weight: 700; color: #464C50 }
.D .col:first-child .dinner { font-size: 26px }

/* ---------- A phone: rows only, light or dark ---------- */
.P { box-sizing: border-box; width: 390px; padding: 20px 16px 24px; background: var(--bg); color: var(--ink2);
  font-family: Roboto, Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased }
.P.light { --bg: #F6F7F4; --ink2: #16191B; --soft2: #4A5054; --soft-b: #3A3E41; --line2: #DADDD8 }
.P.dark { --bg: #111111; --ink2: #E1E1E1; --soft2: #B5B5B5; --soft-b: #B5B5B5; --line2: #2D3337 }
.P h2 { font-size: 21px; font-weight: 700; margin: 14px 0 8px; display: flex; justify-content: space-between; align-items: baseline }
.P h2:first-child { margin-top: 0 }
.P h2 span { font-size: 14px; font-weight: 600; color: var(--soft2) }
.P .list { display: flex; flex-direction: column; gap: 7px; font-size: 17px }
.P .ev .tm { font-size: .82em } .P .ev .barc { min-height: 2.2em }

/* ---------- Settings: People and colors (phone, light) ---------- */
.S { box-sizing: border-box; width: 390px; height: 844px; padding: 54px 16px 24px; background: #F6F7F4; color: #16191B; overflow: hidden;
  font-family: Roboto, Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; --soft2: #4A5054 }
.S .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px }
.S .top b { font-size: 24px } .S .top span { font-size: 17px; font-weight: 600; padding: 10px 4px; min-height: 40px; box-sizing: border-box }
.S h3 { font-size: 14px; font-weight: 700; color: var(--soft2); margin: 16px 4px 6px; text-transform: uppercase; letter-spacing: .04em }
.S .card { background: #FFFFFF; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px #E2E5E0 }
.S .card > .hd { font-size: 17px; font-weight: 700; padding: 14px 16px 4px }
.S .prow { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; width: 100%; min-height: 64px; padding: 8px 16px; cursor: pointer }
.S .prow + .pnote, .S .prow { border-top: 0 } .S .pwrap + .pwrap { border-top: 1px solid #E2E5E0 }
.S .prow .nm { font-size: 18px; font-weight: 600 } .S .prow .nm small { display: block; font-size: 15px; font-weight: 500; color: var(--soft2) }
.S .prow .chev { font-size: 26px; color: var(--soft2) }

.S .crow { display: flex; justify-content: space-between; align-items: center; min-height: 56px; padding: 0 16px; font-size: 17px; font-weight: 600 }
.S .crow span { color: var(--soft2); font-size: 26px; font-weight: 400 }

.S .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 18px 18px 0 0; padding: 14px 16px 26px; box-shadow: 0 -6px 30px rgba(0,0,0,.2) }
.S .sheet .sh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px }
.S .sheet .sh b { font-size: 20px }
.S .sheet .done { all: unset; font-size: 17px; font-weight: 700; padding: 10px 16px; border-radius: 22px; background: #E7EAE5; min-height: 44px; box-sizing: border-box; cursor: pointer }
.S .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 8px }
.S .grid button { all: unset; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; min-height: 56px; padding: 2px 0 }
.S .grid .mini { width: 72px; height: 44px }
.S .grid .lbl { font-size: 14px; font-weight: 600; text-align: center; line-height: 1.15 }
.S .grid .lbl small { display: block; font-weight: 500; color: var(--soft2); font-size: 12.5px }
.S .more { display: flex; align-items: center; gap: 12px; margin-top: 16px; min-height: 56px; border-radius: 12px; background: #F1F3EF; padding: 0 14px; font-size: 17px; font-weight: 700; cursor: pointer; position: relative }
.S .more .rb { width: 36px; height: 36px; border-radius: 50%; background: conic-gradient(#E03131, #E69F00, #548C03, #007A5A, #0091C8, #3944A9, #A86DD5, #CD677B, #E03131) }
.S .more input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer }
.S .more small { display: block; font-size: 13px; font-weight: 500; color: var(--soft2) }
.S .snote { margin-top: 12px; font-size: 15px; font-weight: 500; line-height: 1.35; min-height: 20px }
.S .snote div + div { margin-top: 4px } .S .snote .ok { color: var(--soft2) }
</style>

<h1>The 12 person colors</h1>
<p class="intro" id="intro"></p>
<div class="stage" id="stage"></div>
<div class="about" id="about"></div>

<nav class="switcher" aria-label="Prototype controls">
  <div class="grp"><button id="prev" aria-label="Previous set">&#8249;</button><span class="name" id="vname"></span><button id="next" aria-label="Next set">&#8250;</button></div>
  <div class="grp" id="views"></div>
  <div class="grp" id="dists"></div>
</nav>

<script>
// ---------- color math: WCAG contrast, OKLCH, CIELAB, CIEDE2000, Szafir 2018 ----------
const hex2rgb = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255); };
const rgb2hex = c => '#' + c.map(v => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, '0')).join('').toUpperCase();
const lin = v => v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
const gam = v => v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055;
const lum = c => { const [r, g, b] = c.map(lin); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
function oklch(c) {
  const [r, g, b] = c.map(lin);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  const L = 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, A = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, B = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s;
  return [L, Math.hypot(A, B), (Math.atan2(B, A) * 180 / Math.PI + 360) % 360];
}
// OKLCH to sRGB; where the screen can't show that much colorfulness, it drops until it fits, hue and lightness kept.
function fromOklch(L, C, h) {
  const at = c => { const a = c * Math.cos(h * Math.PI / 180), b = c * Math.sin(h * Math.PI / 180);
    const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3, s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
    return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s]; };
  const ok = lr => lr.every(v => v >= -1e-4 && v <= 1 + 1e-4);
  let lr = at(C);
  if (!ok(lr)) { let lo = 0, hi = C; for (let i = 0; i < 30; i++) { const mid = (lo + hi) / 2; if (ok(at(mid))) lo = mid; else hi = mid; } lr = at(lo); }
  return lr.map(v => gam(Math.min(1, Math.max(0, v))));
}
function lab(c) {
  const [r, g, b] = c.map(lin), f = t => t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116;
  const X = (0.4124564 * r + 0.3575761 * g + 0.1804375 * b) / 0.95047, Y = 0.2126729 * r + 0.7151522 * g + 0.0721750 * b, Z = (0.0193339 * r + 0.1191920 * g + 0.9503041 * b) / 1.08883;
  return [116 * f(Y) - 16, 500 * (f(X) - f(Y)), 200 * (f(Y) - f(Z))];
}
function de2000(c1, c2) {
  const [L1, a1, b1] = lab(c1), [L2, a2, b2] = lab(c2), rad = Math.PI / 180;
  const Cb = (Math.hypot(a1, b1) + Math.hypot(a2, b2)) / 2, G = 0.5 * (1 - Math.sqrt(Cb ** 7 / (Cb ** 7 + 25 ** 7)));
  const ap1 = a1 * (1 + G), ap2 = a2 * (1 + G), Cp1 = Math.hypot(ap1, b1), Cp2 = Math.hypot(ap2, b2);
  const hp = (b, a) => (a === 0 && b === 0) ? 0 : (Math.atan2(b, a) / rad + 360) % 360, h1 = hp(b1, ap1), h2 = hp(b2, ap2);
  let dh = 0; if (Cp1 * Cp2) { dh = h2 - h1; if (dh > 180) dh -= 360; else if (dh < -180) dh += 360; }
  const dL = L2 - L1, dC = Cp2 - Cp1, dH = 2 * Math.sqrt(Cp1 * Cp2) * Math.sin(dh * rad / 2), Lb = (L1 + L2) / 2, Cpb = (Cp1 + Cp2) / 2;
  let hb = h1 + h2; if (Cp1 * Cp2) hb = Math.abs(h1 - h2) > 180 ? (h1 + h2 + (h1 + h2 < 360 ? 360 : -360)) / 2 : (h1 + h2) / 2;
  const T = 1 - 0.17 * Math.cos((hb - 30) * rad) + 0.24 * Math.cos(2 * hb * rad) + 0.32 * Math.cos((3 * hb + 6) * rad) - 0.20 * Math.cos((4 * hb - 63) * rad);
  const SL = 1 + 0.015 * (Lb - 50) ** 2 / Math.sqrt(20 + (Lb - 50) ** 2), SC = 1 + 0.045 * Cpb, SH = 1 + 0.015 * Cpb * T;
  const RT = -2 * Math.sqrt(Cpb ** 7 / (Cpb ** 7 + 25 ** 7)) * Math.sin(60 * Math.exp(-(((hb - 275) / 25) ** 2)) * rad);
  return Math.sqrt((dL / SL) ** 2 + (dC / SC) ** 2 + (dH / SH) ** 2 + RT * (dC / SC) * (dH / SH));
}
const mix = (c, bg, p) => c.map((v, i) => v * p + bg[i] * (1 - p)); // color-mix(in srgb)
// Szafir 2018: two marks 0.3 degrees across (a block row at 9 ft); 1.0 means half of viewers notice any difference.
const SZ = [5.095 + 0.80 / 0.3, 5.089 + 2.69 / 0.3, 6.786 + 3.20 / 0.3];
const szafir = (c1, c2) => { const A = lab(c1), B = lab(c2); return Math.sqrt(A.reduce((s, v, i) => s + ((v - B[i]) / SZ[i]) ** 2, 0)); };

const WALL = hex2rgb('#F4F5F2'), PHONE_LIGHT = hex2rgb('#F6F7F4'), PHONE_DARK = hex2rgb('#111111');
const AMBER = hex2rgb('#E69F00'), RED = hex2rgb('#E03131');
const isDark = bg => lum(bg) < 0.18;
function barFor(C, h, bg, ratio) {
  const dark = isDark(bg); let lo = dark ? oklch(bg)[0] : 0, hi = dark ? 1 : oklch(bg)[0];
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2, k = contrast(fromOklch(mid, C, h), bg); if ((k < ratio) === dark) lo = mid; else hi = mid; }
  return fromOklch(dark ? hi : lo, C, h);
}
// Each person's color is kept as picked. Its stand-off from the wall, held to 3:1 to 7.5:1, is what every look keeps.
const stored = pick => Math.min(7.5, Math.max(3, contrast(pick, WALL)));
function bar(pick, bg, rule = 'mirror') {
  const k = contrast(pick, bg), [, C, h] = oklch(pick);
  if (!isDark(bg)) return (k >= 3 && k <= 7.5 && bg === WALL) ? pick : barFor(C, h, bg, stored(pick));
  if (rule === 'minimal') return k >= 4.5 ? pick : barFor(C, h, bg, 4.5);
  return barFor(C, h, bg, Math.max(4.5, stored(pick)));
}
const marks = (pick, bg, rule) => { const b = bar(pick, bg, rule); return { c: rgb2hex(b), blk: rgb2hex(mix(b, bg, 0.17)), wk: rgb2hex(mix(b, bg, 0.08)) }; };
const wallBlock = pick => mix(bar(pick, WALL), WALL, 0.17);
const tooClose = (p, q) => szafir(wallBlock(p), wallBlock(q)) < 0.45;

// ---------- the three candidate sets (hue order, as the picker shows them) ----------
const SETS = {
  a: { name: 'A · The proposed 12', colors: [['Rose', '#CD677B'], ['Rust', '#923716'], ['Vermillion', '#D55E00'], ['Leaf', '#548C03'], ['Forest', '#286209'], ['Green', '#007A5A'],

// Lists never cut a row in half: rows that don't fit drop from the end and are counted.
function fit(root) {
  for (const el of root.querySelectorAll('[data-shrink]')) {
    const inner = el.firstElementChild, start = parseFloat(getComputedStyle(el).fontSize);
    let size = start; const lines = () => inner.clientHeight / (size * 1.04), set = v => { size = v; el.style.fontSize = `${v}px`; };
    while (lines() > 1.5 && size > 76) set(size - 4);
    if (lines() > 1.5) { set(start); while (lines() > 2.5 && size > +el.dataset.shrink) set(size - 4); }
  }
  for (const box of root.querySelectorAll('[data-fit]')) {
    const rows = [...box.children].filter(el => el.classList.contains('ev'));
    let hidden = 0; const more = document.createElement('div'); more.className = 'more';
    while (box.scrollHeight > box.clientHeight + 1 && rows.length) { rows.pop().remove(); hidden++; if (!more.isConnected) box.appendChild(more); more.textContent = `+${hidden} more`; }
  }
}

  if (state.view === 'wall') html = box('The wall <span>· the starting three</span>', face(HOUSE), 1200, 800);
  if (state.view === 'all') html = box('The wall <span>· all 12</span>', twelveFace(), 1200, 800);
  if (state.view === 'phones') html = [[PHONE_LIGHT, 'mirror', 'Light'], [PHONE_DARK, 'mirror', 'Dark, mirror <span>· taken</span>'], [PHONE_DARK, 'minimal', 'Dark, minimal']]
    .map(([bg, rule, cap]) => box(cap, phone(bg, rule, cap), 390, 0)).join('');
  if (state.view === 'compare') { const v = state.v; html = keys.map(k => { state.v = k; return box(`${SETS[k].name} <span>· all 12 at 9 ft</span>`, twelveFace(), 1200, 800); }).join(''); state.v = v; }
  if (state.view === 'will') { const w = state.pick.will; html = ['Blue', 'Indigo', 'Cornflower'].map(n => { const k = S().colors.findIndex(([m]) => m === n); if (k < 0) return ''; state.pick.will = k; const b = szafir(wallBlock(hex2rgb(pickHex('will'))), wallBlock(hex2rgb(pickHex('us')))).toFixed(2); return box(`Will in ${n} <span>· 9 ft · Will to Us ${b}</span>`, face(HOUSE), 1200, 800).replace('class="frame"', 'class="frame" data-far="1"') + box(`Will in ${n} <span>· full size</span>`, face(HOUSE), 1200, 800); }).join(''); if (w === undefined) delete state.pick.will; else state.pick.will = w; }
  if (state.view === 'colors') html = box('Settings <span>· a phone</span>', settings(), 390, 844) + box('The wall at 9 ft <span>· live</span>', face(HOUSE), 1200, 800);
  st.innerHTML = html;
  document.getElementById('vname').textContent = S().name;
  document.getElementById('intro').innerHTML = 'Three candidate sets of 12 person colors, each drawn the way it will be seen. Made-up events. The bar switches the set, the view and the distance; Settings changes anyone\'s color everywhere on this page. Judged in normal color vision.';
  document.getElementById('about').innerHTML = `<p>${S().about}</p><p>${VIEW_ABOUT[state.view]}</p>${legend()}`;
  for (const [id, key] of [['views', 'view'], ['dists', 'd']]) for (const b of document.querySelectorAll(`#${id} button`)) b.setAttribute('aria-pressed', b.dataset.k === state[key]);
  document.getElementById('dists').style.display = state.view === 'wall' || state.view === 'all' ? '' : 'none';
  st.classList.toggle('pairs', state.view === 'will');
  document.body.classList.toggle('shot', state.shot);
  if (!state.shot) writeHash();
  layout();
  for (const f of st.querySelectorAll('.face')) fit(f);
}
function layout() {
  const avail = document.documentElement.clientWidth - (state.shot ? 24 : 32);
  for (const fr of document.querySelectorAll('.frame')) {
    const inner = fr.firstElementChild, W = +fr.dataset.w, H = +fr.dataset.h || inner.scrollHeight;
    let w = Math.min(W, avail);
    if (inner.classList.contains('face')) {
      if (state.view === 'colors' || state.view === 'compare' || (state.view === 'will' && fr.dataset.far)) w = DISTS['9ft'].w;
      if (state.view === 'will' && !fr.dataset.far) w = Math.min(560, avail);
      else if (state.d === '9ft' && !state.shot) w = DISTS['9ft'].w;
      else if (state.d === '9ft' && state.shot) w = 300;
    }
    const s = w / W;
    fr.style.width = `${Math.round(W * s)}px`; fr.style.height = `${Math.round(H * s)}px`; inner.style.transform = `scale(${s})`;
  }
}
function buttons(id, obj, key) {
  const el = document.getElementById(id);
  el.innerHTML = Object.entries(obj).map(([k, o]) => `<button data-k="${k}" aria-pressed="false">${o.label}</button>`).join('');
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state[key] = b.dataset.k; render(); } });
}
const step = n => { state.v = keys[(keys.indexOf(state.v) + n + keys.length) % keys.length]; render(); };
buttons('views', VIEWS, 'view'); buttons('dists', DISTS, 'd');
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('stage').addEventListener('click', e => {
  const o = e.target.closest('[data-open]'), k = e.target.closest('[data-pick]'), c = e.target.closest('[data-close]');
  if (o) { state.open = o.dataset.open; render(); }
  else if (k) { state.pick[state.open] = +k.dataset.pick; render(); }
  else if (c) { state.open = null; render(); }
});
document.getElementById('stage').addEventListener('change', e => { const m = e.target.closest('[data-more]'); if (m) { state.pick[m.dataset.more] = m.value.toUpperCase(); render(); } });
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
window.addEventListener('resize', layout);
window.addEventListener('hashchange', () => { readHash(); render(); });
readHash(); render();
if (document.fonts) document.fonts.ready.then(render);
</script>
