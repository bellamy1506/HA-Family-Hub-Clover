<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- House fork test harness: the real served card with a fake Home Assistant.
     See test_board_open.js. Query: view=week|month, week=week|planner|agenda,
     month=month|split, timeline=on|off, cal=<calendar answer delay ms>,
     fail=1 (calendars error), privacy=on (household privacy mode),
     theme=<theme id> (this copy's theme; theme_builder/list answers after 300 ms),
     meals=all (meals in Month and Agenda too), nomeal=1 (no meals planned),
     drop=1 (day +3's events deleted), cache=1 (the server has a copy of every
     calendar, its titles starting CACHED; puts recorded in window.__cachePuts),
     slow=<entity> (that calendar answers 3x later), privacydelay=<ms>,
     cachedelay=<ms> (the copy answers that much later), hdr=0 (no Home
     Assistant top bar, as in a kiosk), eventfont=<px> (the theme's event
     text size, with theme=liquidglassdark), wx=1 (a weather entity with a
     daily forecast, so Week's day headers show temperatures), grey=off
     ("Grey out past events" off; on by default), lengths=1 (today's
     timeline gets 15, 30, 90 and 120 minute events). Themes:
     liquidglassdark (the test's own colors), and the built-in presets
     liquidglass, halight and midnight with their real colors. -->
<style>html,body{margin:0;background:#111}#hdr{height:56px}</style></head>
<body><div id="hdr"></div><div id="stack"></div>
<script>if (new URLSearchParams(location.search).get("hdr") === "0") document.getElementById("hdr").remove();</script>
<script>
const q = new URLSearchParams(location.search);
localStorage.setItem("familyCalendarMonthViewVariantLocal", q.get("month") || "split");
localStorage.setItem("familyCalendarWeekViewVariantLocal", q.get("week") || "planner");
localStorage.setItem("familyCalendarShowTimelineLocal", q.get("timeline") || "off");
localStorage.setItem("familyCalendarTopBarTitleOnlyLocal", "on");
localStorage.setItem("familyHubDeviceThemeOverrideLocal", q.get("theme") || "");
</script>
<script src="card.js"></script>
<script>
(async () => {
const CAL_DELAY = +(q.get("cal") || 1500);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const today = new Date();
const day = (offset) => { const d = new Date(today); d.setDate(d.getDate() + offset); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const timed = (o, s, h) => ({ summary: s, start: { dateTime: `${day(o)}T${String(h).padStart(2, "0")}:00:00` }, end: { dateTime: `${day(o)}T${String(h + 1).padStart(2, "0")}:00:00` } });
const span = (o, s, h, m, mins) => { const at = (t) => `${day(o)}T${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}:00`; return { summary: s, start: { dateTime: at(h * 60 + m) }, end: { dateTime: at(h * 60 + m + mins) } }; };
const allDay = (o, s) => ({ summary: s, start: { date: day(o) }, end: { date: day(o + 1) } });
const THEME = { id: "liquidglassdark", name: "Liquid Glass Dark", colors: { bg: "#0b1020", card: "#1b2133", border: "#2a3350", text: "#e8ecf5", textSecondary: "#9aa3b8", accent: "#4f8cff", accentText: "#ffffff", accent2: "#7ec9d9", accent3: "#b07ed9", surfaceAlt: "#222a40", surface2: "#1f2638" }, fonts: { dayName: 13, dayNumber: 22, wxTemp: 14, event: 14, chip: 13, headerTitle: 15, countdown: 11, blockLabel: 9, blockMeal: 13 }, cardOpacity: 55, glassBlur: 18 };
if (q.get("eventfont")) THEME.fonts.event = +q.get("eventfont");
// Built-in presets, colors as __init__.py's _seed_themes (no background image).
const preset = (id, name, colors, glass) => ({ id, name, colors, fonts: { ...THEME.fonts }, ...(glass || {}) });
const PRESETS = [
  preset("liquidglass", "Liquid Glass", { bg: "#eef3f8", card: "#ffffff", border: "#d7e3f0", text: "#1c2733", textSecondary: "#66758a", accent: "#0a84ff", accentText: "#ffffff", accent2: "#30b0c7", accent3: "#ff3b30", surfaceAlt: "#eef4fb", surface2: "#e4edf7" }, { cardOpacity: 62, glassBlur: 16 }),
  preset("halight", "HA Light", { bg: "#fafafa", card: "#ffffff", border: "#e0e0e0", text: "#212121", textSecondary: "#727272", accent: "#03a9f4", accentText: "#ffffff", accent2: "#43a047", accent3: "#ff9800", surfaceAlt: "#f2f2f2", surface2: "#f6f6f6" }),
  preset("midnight", "Midnight", { bg: "#12141c", card: "#1a1d29", border: "#2a2f42", text: "#e4e6f0", textSecondary: "#8b90a8", accent: "#c9a227", accentText: "#1a1400", accent2: "#3ea67a", accent3: "#b5583c", surfaceAlt: "#232739", surface2: "#1f2333" }),
];
const people = [["calendar.wills_calendar", "Will", "#7ec9d9"], ["calendar.home", "Home", "#9ed97e"], ["calendar.us", "Us", "#d9bf7e"], ["calendar.work", "Work", "#b07ed9"]];
const dropped = (list) => (q.get("drop") ? list.filter((e) => !(e.start.dateTime || e.start.date).startsWith(day(3))) : list);
const events = {
  "calendar.wills_calendar": [timed(0, "SECRET dentist appointment with a long title that wraps", 9), timed(1, "SECRET flight", 13), allDay(2, "SECRET trip"), timed(-3, "SECRET lunch", 12), timed(3, "SECRET call", 15), timed(3, "SECRET call two", 16), timed(3, "SECRET call three", 17), timed(3, "SECRET call four", 18)],
  "calendar.home": [timed(0, "SECRET trash night", 19), allDay(1, "SECRET holiday")],
  "calendar.us": [timed(2, "SECRET dinner", 18)],
  "calendar.work": [timed(1, "SECRET meeting", 10)],
};
// lengths=1: today's events of other lengths on the Us calendar (15 and 30
// minutes, a long title in 90 minutes, and 2 hours sharing its hour).
if (q.get("lengths")) events["calendar.us"].push(span(0, "SECRET quick call", 11, 0, 30), span(0, "SECRET pills", 11, 30, 15), span(0, "SECRET parent teacher conference at the elementary school", 13, 0, 90), span(0, "SECRET long meeting about the kitchen renovation plans", 14, 0, 120));
const settings = { blocks: ["Breakfast", "Lunch", "Dinner"], dateBlocks: {}, weekdayBlocks: {}, blockSize: "medium", defaultView: q.get("view") || "month", weekViewVariantShared: "planner", monthViewVariantShared: "split", weekDayCountShared: 7, weekRowsShared: 1, timelineStartHour: 8, timelineEndHour: 21, countdownEnabled: false, countdownItems: [], people: [], showMealsInMonth: q.get("meals") === "all", agendaShowMeals: q.get("meals") === "all", agendaDays: 7, greyOutPastEvents: q.get("grey") !== "off", bottomPadding: 0, useGlobalTheme: false, globalThemeId: "", memberUserIds: ["u1"], userProfiles: {}, holidayBackgrounds: [] };
const states = {};
people.forEach(([e, n]) => (states[e] = { entity_id: e, state: "off", attributes: { friendly_name: n } }));
const hass = {
  user: { id: "u1", is_admin: true, name: "Test" }, language: "en", locale: { language: "en" }, themes: { themes: {}, darkMode: false }, states,
  callApi: async (m, path) => {
    await sleep(q.get("slow") && path.includes(q.get("slow")) ? CAL_DELAY * 3 : CAL_DELAY);
    setTimeout(() => (window.__calAnswered = (window.__calAnswered || 0) + 1), 0);
    if (q.get("fail")) throw new Error("calendar unreachable");
    return dropped(events[path.split("?")[0].replace("calendars/", "")] || []);
  },
  callWS: async () => ({}), callService: async () => ({}),
  connection: {
    sendMessagePromise: async (msg) => {
      await sleep(40);
      if (msg.type === "family_hub/get_settings") return { settings };
      if (msg.type === "theme_builder/list") { await sleep(300); return { themes: [THEME, ...PRESETS] }; }
      if (msg.type === "call_service" && msg.service === "get_forecasts") {
        const forecast = [];
        for (let o = -10; o <= 14; o++) forecast.push({ datetime: `${day(o)}T12:00:00`, condition: "partlycloudy", temperature: 60 + (o % 5), templow: 45 + (o % 4) });
        return { response: { [msg.target.entity_id]: { forecast } } };
      }
      if (msg.type === "family_hub/privacy_mode/get_state") { await sleep(+(q.get("privacydelay") || 0)); return { enabled: q.get("privacy") === "on" }; }
      if (msg.type === "family_hub/calendar_cache/get") {
        if (!q.get("cache")) return { calendars: {} };
        await sleep(+(q.get("cachedelay") || 0));
        const copy = {};
        msg.entity_ids.forEach((id) => (copy[id] = (events[id] || []).map((e) => ({ ...e, summary: e.summary.replace("SECRET", "CACHED") }))));
        return { calendars: copy };
      }
      if (msg.type === "family_hub/calendar_cache/put") { (window.__cachePuts = window.__cachePuts || []).push(msg); return {}; }
      if (msg.type === "call_service" && msg.service === "get_items") {
        const items = msg.target.entity_id === "todo.meal_plan" && !q.get("nomeal") ? [{ uid: "m1", summary: "Tacos tonight", due: day(0), description: '{"block": 2}', status: "needs_action" }] : [];
        return { response: { [msg.target.entity_id]: { items } } };
      }
      if (msg.type === "family_hub/device_settings/get_pending") return { seq: 0, settings: null, instance: null };
      // As Home Assistant answers: this sets the card's privacy overlay state
      // before privacy mode itself is known.
      if (msg.type === "family_hub/device_settings/report") return { privacy_participates: true };
      return {};
    },
    subscribeMessage: async () => () => {}, subscribeEvents: async () => () => {},
  },
};
const el = document.createElement("family-week-calendar-card");
el.setConfig({ type: "custom:family-week-calendar-card", meal_plan_entity: "todo.meal_plan", ...(q.get("wx") ? { weather_entity: "weather.home" } : {}), people: people.map(([entity, name, color]) => ({ entity, name, color })) });
document.getElementById("stack").appendChild(el);
el.hass = hass;
window.__el = el;
})();
</script></body></html>
