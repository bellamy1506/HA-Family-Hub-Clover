<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion lab</title>
<!--
Motion lab for docs/research/motion-on-the-tablet.md (fork issue #72). Made-up content only.
#p=<test>: one test (a key of TESTS), 4 s after load; the result goes in the hash and on screen.
#all: every test in order (#all2: the second set), each started by a tap anywhere (adb `input tap`), so
`dumpsys gfxinfo <pkg> reset` can print and clear the frame stats between tests.
The last tap shows a table of every result.
-->
<style>
  :root { --ease-out: cubic-bezier(0.2, 0, 0, 1); }
  html, body { margin: 0; height: 100%; }
  body { font: 500 20px/1.3 Roboto, system-ui, sans-serif; background: #F4F5F2; color: #111; overflow: hidden; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px; height: calc(100% - 16px); }
  .col { background: #fff; border-radius: 12px; padding: 8px; overflow: hidden; }
  .day { font-weight: 700; font-size: 24px; margin-bottom: 6px; }
  .ev { border-left: 6px solid #0072B2; background: #EEF3F8; margin: 4px 0; padding: 6px 8px; border-radius: 6px; }
  .ev:nth-child(3n) { border-color: #E69F00; background: #FBF3E4; }
  .ev:nth-child(3n+1) { border-color: #009E73; background: #E8F5F0; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 60%; background: #fff; border-radius: 16px 16px 0 0;
           box-shadow: 0 -8px 24px rgba(0,0,0,.18); padding: 16px 24px; box-sizing: border-box; }
  #sheet .row { padding: 10px 0; border-bottom: 1px solid #ddd; font-size: 24px; }
  body.m-xform #sheet  { transform: translateY(100%); transition: transform 280ms var(--ease-out); }
  body.m-xform #sheet.open { transform: translateY(0); }
  body.m-top #sheet    { bottom: -60%; transition: bottom 280ms var(--ease-out); }
  body.m-top #sheet.open { bottom: 0; }
  body.m-height #sheet { height: 0; padding-top: 0; padding-bottom: 0; overflow: hidden; transition: height 280ms var(--ease-out); }
  body.m-height #sheet.open { height: 60%; }
  body.m-blur #sheet   { background: rgba(255,255,255,.55); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
                         transform: translateY(100%); transition: transform 280ms var(--ease-out); }
  body.m-blur #sheet.open { transform: translateY(0); }
  body.m-none #sheet, body.m-scroll #sheet, body.m-tap #sheet, body.m-wx #sheet, body.m-wl #sheet { display: none; }
  body.m-wx #grid { transition: transform 300ms var(--ease-out); }
  body.m-wx #grid.open { transform: translateX(-50%); }
  body.m-wl #grid { position: relative; left: 0; transition: left 300ms var(--ease-out); }
  body.m-wl #grid.open { left: -50%; }
  #toast { position: fixed; left: 50%; bottom: 24px; width: 520px; margin-left: -260px; padding: 16px 20px; border-radius: 12px;
           background: #222; color: #fff; font-size: 24px; opacity: 0; transform: translateY(12px);
           transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
  #toast.show { opacity: 1; transform: none; }
  #list { display: none; position: fixed; inset: 0; overflow-y: auto; background: #F4F5F2; padding: 8px; }
  body.m-scroll #list { display: block; }
  body.m-scroll #grid { display: none; }
  #list .ev { font-size: 22px; padding: 14px; }
  #btn { display: none; position: fixed; left: 40px; top: 40px; width: 300px; height: 120px; font: 600 28px Roboto, sans-serif; z-index: 5; }
  body.m-tap #btn { display: block; }
  #panel { display: none; position: fixed; left: 380px; top: 40px; width: 400px; padding: 20px; background: #fff; border-radius: 12px; font-size: 24px; z-index: 5; }
  #panel.open { display: block; }
  #out { position: fixed; top: 8px; right: 8px; max-width: 70%; background: #000; color: #7CFC00; font: 600 22px/1.25 monospace;
         padding: 8px 12px; z-index: 9; white-space: pre-wrap; }
  @media (prefers-reduced-motion: reduce) { .respect-rm * { transition-duration: 1ms !important; } }
</style>
</head>
<body>
<div id="grid"></div>
<div id="sheet"></div>
<div id="toast">Added to Thursday. Undo</div>
<div id="list"></div>
<button id="btn">Open</button>
<div id="panel">Dentist, Thursday 3 pm<br>Will</div>
<div id="out">motion lab: waiting</div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.hash.slice(1));
let test = params.get("p") || "xform";
const out = $("#out");
const DAYS = ["Thu", "Fri", "Sat", "Sun"];
const TITLES = ["Dentist", "At work 8 to 5", "Groceries", "Vet for Franklin", "Dinner with Sam", "Call plumber",
  "Yoga", "Library books due", "Haircut", "Trash night", "Pick up prescription", "Book club"];

function gridHtml(seed) {
  return DAYS.map((d, i) => `<div class="col" data-unit="${d}"><div class="day">${d} ${i + 5}</div>` +
    Array.from({ length: 12 }, (_, j) => `<div class="ev"><b>${9 + (j % 10)}:${seed % 2 ? "00" : "30"}</b> ${TITLES[(i * 3 + j) % TITLES.length]}<br>Will</div>`).join("") +
    `</div>`).join("");
}
$("#grid").innerHTML = gridHtml(0);
$("#sheet").innerHTML = `<div class="row"><b>Dentist</b>, Thursday 3 to 4 pm</div>` +
  Array.from({ length: 8 }, (_, i) => `<div class="row">Detail line ${i + 1}: made-up text for the sheet</div>`).join("");
$("#list").innerHTML = Array.from({ length: 240 }, (_, i) => `<div class="ev">${TITLES[i % TITLES.length]}, day ${1 + (i >> 3)}</div>`).join("");

// ---------- measurement ----------
let intervals = []; let rafOn = false; let last = 0;
function rafLoop(t) { if (!rafOn) return; if (last) intervals.push(t - last); last = t; requestAnimationFrame(rafLoop); }
function rafStart() { if (rafOn) return; rafOn = true; last = 0; requestAnimationFrame(rafLoop); }
function rafStop() { rafOn = false; }
const loaf = []; const shifts = []; const events = [];
const observe = (type, list, extra = {}) => { try { new PerformanceObserver((l) => list.push(...l.getEntries())).observe({ type, buffered: false, ...extra }); } catch (e) { } };
observe("long-animation-frame", loaf);
observe("layout-shift", shifts);
observe("event", events, { durationThreshold: 16 });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const busy = (ms) => { const end = performance.now() + ms; while (performance.now() < end) { } };
const pct = (a, p) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(p / 100 * s.length))]; };
const r1 = (x) => Math.round(x * 10) / 10;
function summary(extra) {
  const late = intervals.filter((x) => x > 25).length;     // at least one 60 Hz frame missed
  const bad = intervals.filter((x) => x > 50).length;      // two or more missed
  const lf = loaf.filter((e) => e.startTime > t0);
  const cls = shifts.filter((e) => !e.hadRecentInput && e.startTime > t0).reduce((s, e) => s + e.value, 0);
  return Object.assign({ test, frames: intervals.length, p50: r1(pct(intervals, 50)), p95: r1(pct(intervals, 95)),
    max: r1(Math.max(0, ...intervals)), late, bad, loaf: lf.length, loafMax: Math.round(Math.max(0, ...lf.map((e) => e.duration))),
    cls: Math.round(cls * 1000) / 1000, ua: (navigator.userAgent.match(/Chrome\/[\d.]+/) || ["?"])[0],
    rm: matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 0, dpr: devicePixelRatio, vw: innerWidth, vh: innerHeight }, extra || {});
}
function report(s) {
  const line = Object.entries(s).map(([k, v]) => `${k}=${v}`).join("&");
  out.textContent = line.replace(/&/g, "  ");
  try { history.replaceState(null, "", "#p=" + test + "&done=1&" + line); } catch (e) { }  // throws in a data: page
  window.__result = s;
  (window.__all = window.__all || []).push(s);
}

// ---------- tests ----------
async function cycles(mode, n, busyMs, busyAfter) {
  document.body.className = "m-" + mode;
  const sheet = $(mode === "wx" || mode === "wl" ? "#grid" : "#sheet");
  await sleep(300);
  for (let i = 0; i < n; i++) {
    for (const open of [true, false]) {
      rafStart();
      sheet.classList.toggle("open", open);
      if (busyMs && busyAfter) setTimeout(() => busy(busyMs), busyAfter);  // a render arriving mid-slide
      else if (busyMs) busy(busyMs);      // a render right as the slide starts
      await sleep(450);
      rafStop();
      await sleep(350);
    }
  }
}
async function toastCycles(n, busyMs) {
  document.body.className = "m-none";
  const t = $("#toast");
  for (let i = 0; i < n; i++) {
    for (const show of [true, false]) { rafStart(); t.classList.toggle("show", show); if (busyMs) busy(busyMs); await sleep(400); rafStop(); await sleep(300); }
  }
}
async function rerender(n, full) {
  document.body.className = "m-none";
  const times = [];
  for (let i = 1; i <= n; i++) {
    const a = performance.now();
    if (full) { $("#grid").innerHTML = gridHtml(i); }
    else { $("#grid .ev b").textContent = `9:${i % 2 ? "00" : "30"}`; }
    void $("#grid").offsetHeight;          // force layout now so it is timed
    times.push(performance.now() - a);
    await sleep(500);
  }
  return { renderP50: r1(pct(times, 50)), renderMax: r1(Math.max(...times)) };
}
async function shiftDemo(reserve) {
  // Data arriving after shapes: a line is inserted above the grid. With `reserve`, its space was held from the start.
  document.body.className = "m-none";
  const g = $("#grid");
  const bar = document.createElement("div");
  bar.style.cssText = "height:" + (reserve ? "60px" : "0") + ";background:#fff;margin:0 8px;border-radius:8px;overflow:hidden";
  document.body.insertBefore(bar, g);
  await sleep(1000);
  bar.style.height = "60px"; bar.textContent = "Rain from 2 pm";
  await sleep(1000);
  return {};
}
async function scrollTest() {
  document.body.className = "m-scroll";
  let scrolls = 0; $("#list").addEventListener("scroll", () => { scrolls++; rafStart(); clearTimeout(window.__st); window.__st = setTimeout(rafStop, 300); }, { passive: true });
  await sleep(9000);                       // an ADB `input swipe` flings the list in this window
  return { scrolls };
}
async function tapTest() {
  document.body.className = "m-tap";
  $("#btn").addEventListener("click", () => { $("#panel").classList.toggle("open"); });
  await sleep(9000);                       // ADB `input tap` presses the button in this window
  const ev = events.filter((e) => e.name === "pointerup" || e.name === "click" || e.name === "pointerdown");
  const d = ev.map((e) => e.duration);
  const delay = ev.map((e) => e.processingStart - e.startTime);
  return { taps: ev.filter((e) => e.name === "click").length, evDurMax: Math.round(Math.max(0, ...d)), evDurP50: Math.round(pct(d, 50)), inDelayMax: Math.round(Math.max(0, ...delay)) };
}
const TESTS = {
  idle: async () => { document.body.className = "m-none"; await sleep(9000); return {}; },
  xform: () => cycles("xform", 6, 0),
  "xform-busy": () => cycles("xform", 6, 150),
  top: () => cycles("top", 6, 0),
  "top-busy": () => cycles("top", 6, 150),
  "xform-mid": () => cycles("xform", 6, 150, 80),
  "top-mid": () => cycles("top", 6, 150, 80),
  "week-xform": () => cycles("wx", 6, 0),
  "week-left": () => cycles("wl", 6, 0),
  height: () => cycles("height", 6, 0),
  blur: () => cycles("blur", 6, 0),
  toast: () => toastCycles(6, 0),
  "render-full": () => rerender(12, true),
  "render-patch": () => rerender(12, false),
  "shift": () => shiftDemo(false),
  "shift-reserved": () => shiftDemo(true),
  scroll: scrollTest,
  tap: tapTest,
};
let t0 = 0;
async function runOne(name) {
  test = name; intervals = []; t0 = performance.now();
  out.textContent = "motion lab: " + test + " running";
  const extra = await (TESTS[test] || TESTS.xform)();
  await sleep(200);
  report(summary(extra));
}
window.addEventListener("load", async () => {
  if (location.hash.includes("all")) {
    const order = location.hash.includes("all2") ? ["xform-mid", "top-mid", "blur", "week-xform", "week-left"] : ["idle", "xform", "xform-busy", "top", "top-busy", "height", "blur", "toast", "render-full", "render-patch", "scroll", "tap"];
    let i = 0, running = false;
    out.textContent = "motion lab: tap to start " + order[0];
    document.addEventListener("pointerdown", async (e) => {
      if (running || e.target.id === "btn") return;
      if (i >= order.length) {        // one more tap: the table
        document.body.className = "m-none"; $("#grid").style.display = "none";
        out.style.maxWidth = "96%";
        out.textContent = window.__all.map((r) => [r.test, "f" + r.frames, "p50 " + r.p50, "p95 " + r.p95, "max " + r.max, "late " + r.late, "bad " + r.bad, "loaf " + r.loaf + "/" + r.loafMax,
          "cls " + r.cls, r.renderP50 !== undefined ? "render " + r.renderP50 + "/" + r.renderMax : "", r.scrolls !== undefined ? "scrolls " + r.scrolls : "",
          r.taps !== undefined ? "taps " + r.taps + " dur " + r.evDurP50 + "/" + r.evDurMax + " delay " + r.inDelayMax : ""].join(" ")).join("\n") +
          "\n" + window.__all[0].ua + " dpr " + window.__all[0].dpr + " " + window.__all[0].vw + "x" + window.__all[0].vh + " rm " + window.__all[0].rm;
        return;
      }
      running = true; await sleep(500); await runOne(order[i++]); running = false;
      out.textContent += "\nnext: " + (order[i] || "table");
    });
    return;
  }
  out.textContent = "motion lab: " + test + " starts in 4 s";
  await sleep(4000);
  await runOne(test);
});
</script>
</body>
</html>
